<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="Login.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
    <div class="Logindiv">
    <h1>Login Page</h1>
    <form action="">


        <div class="inputboxes">
        <input type="text"  placeholder="Enter Email or Username" required>
        <span  id="person" class="material-symbols-outlined">person</span>
        <input type="password" placeholder="Enter Password" required>
        <span id="lock" class="material-symbols-outlined">lock</span>
         </div>



         <div class="remember-row">
        <div class="remember">
        <input type="checkbox" id="checkbox">
        <label for="checkbox">Remember Me</label>
       </div>

        <a href="">ForgotPassword</a>
     </div>
        <button type="submit">Login</button>
    </form>
    
    
    <p>Don't have an Account? <a href="">SingUp</a></p>
    </div>
</body>
</html>
